name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Run tests
        run: zig build test

  build:
    name: Build Plugins
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Build x32 and x64 plugins
        run: zig build -Doptimize=ReleaseFast

      - name: Upload compiled plugins
        uses: actions/upload-artifact@v4
        with:
          name: x64dbg-mcp-server-plugins
          path: |
            zig-out/x32/plugins/x64dbg-MCP-Server.dp32
            zig-out/x64/plugins/x64dbg-MCP-Server.dp64
          if-no-files-found: error
          retention-days: 30
